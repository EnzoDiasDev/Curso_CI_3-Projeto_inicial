name: Entrega Contínua

on:
  workflow_call:

jobs:
  
  EC2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Download a Build Artifact
      uses: actions/download-artifact@v8
      with:
    # Artifact name
        name: programa

    - name: Deploy to Staging server
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        TARGET: /home/${{ secrets.REMOTE_USER }}
        EXCLUDE: "postgres-data"
        SCRIPT_BEFORE: |
          whoami
          ls -al
        SCRIPT_AFTER: |
          whoami
          ls -al
          echo $RSYNC_STDOUT

    - name: Execute remote SSH commands using password
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        debug: true
        script: |
          set -x
          whoami
          pwd
          ls -l main templates assets
          export HOST=${{ secrets.DBHOST }}
          export USER=${{ secrets.DBUSER }}
          export PASSWORD=${{ secrets.DBPASSWORD }}
          export DBNAME=${{ secrets.DBNAME }}
          export DBPORT=${{ secrets.DBPORT }}
          export PORT=8000
          echo "HOST=$HOST DBPORT=$DBPORT USER=$USER DBNAME=$DBNAME"
          chmod +x main
          nohup ./main > nohup.out 2> nohup.err < /dev/null &
          sleep 5                                                      
          echo "----- nohup.out -----"; tail -n 30 nohup.out           
          echo "----- nohup.err -----"; tail -n 30 nohup.err           
          pgrep -af '\./main' || echo "API NAO ESTA RODANDO"