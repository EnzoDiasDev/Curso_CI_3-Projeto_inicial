name: Load Test

on:
  workflow_call:

jobs:
  
  loadtest:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - run: git clone https://github.com/EnzoDiasDev/infra-api-go-cicd-aws-ecs

    - name: HashiCorp - Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform init
      run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog init

    - name: Destroy infra
      run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog destroy -auto-approve -var "imagem=enzodias31/go_ci3:${{ github.run_number }}"

    - name: Apply terraform
      run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog apply -auto-approve -var "imagem=enzodias31/go_ci3:${{ github.run_number }}"
    
    - name: Output terraform
      run: echo "$(terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog output -raw IP_alb)"

    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13' 
    
    - name: Pip installer
      uses: BSFishy/pip-action@v1
      with:
        packages: |
          locust
    
    - run: echo "" >> locustfile.py